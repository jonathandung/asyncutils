version: 2
updates:
  - directory: /
    package-ecosystem: uv
    schedule: {interval: weekly}
    cooldown: {default-days: 10}
    groups: {all: {patterns: ['*']}}
  - directory: /
    package-ecosystem: github-actions
    schedule: {interval: weekly}
    cooldown: {default-days: 10}
    groups: {all: {patterns: ['*']}}
