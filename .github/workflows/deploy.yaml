name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: {group: pages}
jobs:
  build:
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{steps.d.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: false
    - run: uv sync --group sbt
    - run: source .venv/bin/activate && make docs
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: docs/build/html
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      id: d
    timeout-minutes: 3
