name: CI
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        activate-environment: true
        enable-cache: false
        python-version: "3.15"
    - run: uv pip install sphinx-lint -e . --group test
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - run: sphinx-lint docs
    - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
      with:
        globs: |
          *.md
          .github/**/*.md
    - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169
      with:
        config: cspell.json
        incremental_files_only: true
    - run: uv audit
    - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
    - run: pytest -vv -p asyncio -p no:asyncio-cooperative --no-local-badge --tb long --cov-report xml
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        flags: unittests
        name: codecov-umbrella
        token: ${{secrets.CODECOV_TOKEN}}
        verbose: true
    timeout-minutes: 3
  secondary:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12", "3.15"]
        include:
        - os: ubuntu-latest
          python-version: 3.15t
        - os: macos-latest
          python-version: gp313
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: ${{matrix.python-version}}
        enable-cache: false
    - run: uv run --group test pytest -vv -p asyncio --no-cov -p no:asyncio-cooperative --no-local-badge --tb long
    timeout-minutes: 3
