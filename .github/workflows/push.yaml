name: CI
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        activate-environment: true
        enable-cache: false
        python-version: "3.15"
    - run: uv pip install -e ".[test]"
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - run: make audit
    - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
    - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
      with:
        globs: |
          *.md
          .github/**/*.md
    - uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744
      env:
        SHELLCHECK_OPTS: -x -s bash -e SC2035 -e SC2046 Makefile docs/Makefile
        SHFMT_OPTS: -s
    - run: pytest -vv -p asyncio -p no:asyncio-cooperative --no-local-badge --tb long --cov-report xml
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        flags: unittests
        name: codecov-umbrella
        token: ${{secrets.CODECOV_TOKEN}}
        verbose: true
    timeout-minutes: 3
  secondary:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12", "3.15"]
        include:
          - os: ubuntu-latest
            python-version: 3.15t
        # - os: macos-latest
          # python-version: gp313
        # TODO: Blocked until release on Oct 27
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: ${{matrix.python-version}}
        enable-cache: false
    - run: uv run --with ".[test]" pytest -vv -p asyncio --no-cov -p no:asyncio-cooperative --no-local-badge --tb long
    timeout-minutes: 3
