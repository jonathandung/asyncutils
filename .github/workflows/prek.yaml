name: Update prek hooks
on:
  schedule: [{cron: "0 0 * * 1"}]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: taiki-e/install-action@prek
      - run: prek update
      - run: prek run --all-files
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv audit --preview-features audit-command
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          assignees: jonathandung
          branch: auto-prek
          commit-message: update prek hooks
          delete-branch: true
          sign-commits: true
          signoff: true
          title: Weekly prek hooks update
