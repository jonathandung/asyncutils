[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.3"]

[project]
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "Framework :: AsyncIO", "Framework :: Pytest", "Framework :: Sphinx", "Intended Audience :: Developers", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: Free Threading :: 3 - Stable", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: GraalPy", "Programming Language :: Unix Shell", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Utilities", "Typing :: Typed"]
description = "A library containing versatile tools to well complement the asyncio framework."
keywords = ["asynchronous", "asyncio", "convenient", "fast", "feature-rich", "helpers", "io", "library", "light", "utilities"]
license = "MIT"
license-files = ["AUTHORS.md", "LICENSE"]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
name = "py-asyncutils"
readme = "README.md"
requires-python = ">=3.12"
version = "1.1.3"

[project.urls]
Changelog = "https://asyncutils.readthedocs.io/en/stable/changelog.html"
Documentation = "https://asyncutils.readthedocs.io/en/stable/index.html"
Download = "https://pypi.org/project/py-asyncutils/#files"
Homepage = "https://jonathandung.github.io/asyncutils"
Issues = "https://github.com/jonathandung/asyncutils/issues"
"Release Notes" = "https://github.com/jonathandung/asyncutils/releases/tag/1.1.3"
Repository = "https://github.com/jonathandung/asyncutils.git"

[project.scripts]
asyncutils = "asyncutils.cli:run"
autils = "asyncutils.cli:run"

[project.optional-dependencies]
all = ["py-asyncutils[dev,executors,pconf,themes,ptw]==1.1.3"]
dev = ["py-asyncutils[themes,test]==1.1.3"]
docs = ["sphinx>=9.1.0", "sphinx-autoapi>=3.8.0", "sphinx-copybutton>=0.5.2", "sphinx-notfound-page>=1.1.0", "sphinx-lint>=1.0.2", "sphinxext-opengraph[social-cards]>=0.13.0", "myst-parser>=5.1.0"]
themes = ["furo>=2025.12.19", "sphinx-book-theme>=1.2.0", "py-asyncutils[docs]==1.1.3"]
executors = ["deadpool-executor>=2026.4.1", "executorlib>=1.10.0", "ipyparallel>=9.2.0", "loky>=3.5.6", "Pebble>=5.2.0"]
json5 = ["pyjson5>=2.0.1"]
pconf = ["hjson>=3.1.0", "json-with-comments>=1.2.10", "PyYAML>=6.0.3", "xmltodict>=1.0.4", "py-asyncutils[json5]==1.1.3"]
ptw = ["pytest-watch>=4.2.0"]
req = ["requests>=2.34.2"]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-asyncio-cooperative>=0.40.0", "pytest-cov>=7.1.0", "pytest-local-badge>=1.1.1", "pytest-sugar>=1.1.1", "py-asyncutils[json5]==1.1.3"]

[tool.pytest]
addopts = ["-v", "--tb", "short", "--maxfail", "0", "-W", "ignore::pytest.PytestConfigWarning", "--cov", "asyncutils", "--cov-report", "term-missing", "--cov-fail-under", "57"]
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
minversion = "9.1.1" # cspell:disable-line
python_files = ["test_*.py"]
python_functions = ["test_*"]
required_plugins = ["pytest-cov>=7.1.0", "pytest-local-badge>=1.3.0", "pytest-sugar>=1.1.1"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__main__.py", "*/_internal/compat.py", "*/_internal/py312.py", "*/_internal/py313.py", "*/cli.py"]
source = ["asyncutils"]

[tool.coverage.report]
exclude_also = ["if __name__ == '__main__':", "raise NotImplementedError", "except (\\()?[A-Za-z,\\s]*(\\))?: raise$", "def __repr__\\(self.*\\):", "cover: off(?s:.)*?cover: on", "def __init_subclass__\\(cls, /, \\*\\*_\\):"]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["docs/source/conf.py"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
required-version = ">=0.16.1"
target-version = "py312"

[tool.ruff.lint]
ignore = ["D1", "ambiguous-function-name", "ambiguous-variable-name", "async-function-with-timeout", "bad-exit-annotation", "bad-version-info-order", "blank-line-between-methods", "blank-lines-after-function-or-class", "blank-lines-before-nested-definition", "blank-lines-top-level", "constant-imported-as-non-constant", "docstring-in-stub", "error-suffix-on-exception-name", "implicit-return", "import-outside-top-level", "import-private-name", "incorrect-blank-line-after-class", "incorrect-blank-line-before-class", "invalid-argument-name", "line-too-long", "lowercase-imported-as-non-lowercase", "missing-blank-line-after-summary", "missing-whitespace-around-arithmetic-operator", "missing-whitespace-around-bitwise-or-shift-operator", "missing-whitespace-around-modulo-operator", "missing-whitespace-around-parameter-equals", "multi-line-summary-first-line", "multiple-imports-on-one-line", "multiple-statements-on-one-line-colon", "multiple-statements-on-one-line-semicolon", "non-empty-init-module", "non-lowercase-variable-in-function", "overload-with-docstring", "pytest-incorrect-pytest-import", "pytest-parametrize-values-wrong-type", "raise-vanilla-args", "raise-without-from-inside-except", "too-few-spaces-before-inline-comment", "triple-single-quotes", "try-consider-else"]
logger-objects = ["asyncutils._internal.log"]
preview = true
select = ["A", "ANN", "ARG", "ASYNC", "B", "C4", "D", "E", "EXE", "F", "FURB", "G", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PT", "PYI", "Q", "RET", "RUF", "S", "SIM", "SLOT", "TRY", "UP", "W", "YTT", "blind-except", "commented-out-code", "complex-structure", "debugger", "dot-format-in-exception", "implicit-namespace-package", "line-contains-todo", "print", "prohibited-trailing-comma", "relative-imports", "static-join-to-f-string", "undocumented-public-package", "unnecessary-paren-on-raise-exception"]
typing-extensions = false

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["ANN", "collections-named-tuple", "meta-class-abc-meta"]
"**/*.pyi" = ["relative-imports"]
"tests/**" = ["N", "S", "assignment-in-assert", "import-private-name", "magic-value-comparison", "pytest-raises-ambiguous-pattern", "undefined-local-with-import-star", "undefined-local-with-import-star-usage"]
"!tests/**" = ["PT"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["__import__", "_functools.partial", "asyncutils.IgnoreErrors", "asyncutils.exceptions.StateCorrupted", "classmethod", "collections.namedtuple", "getattr", "globals", "sys.intern", "type"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.pyflakes]
allowed-unused-imports = ["asyncutils._internal.submodules"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 16
max-positional-args = 6
max-public-methods = 29
max-nested-blocks = 5
max-returns = 6
max-statements = 43
max-statements-in-try = 8

[tool.ty.analysis]
allowed-unresolved-imports = ["_collections.**", "_functools.**", "yaml.**", "asyncio.futures._chain_future", "asyncutils.config._randinst", "asyncutils.constants._NO_DEFAULT"]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[tool.ty.src]
include = ["asyncutils", "tests"]

[[tool.ty.overrides]]
include = ["**/*.py"]

[tool.ty.overrides.rules]
missing-type-argument = "ignore"

[tool.uv]
required-version = ">=0.12.3"

[tool.uv.build-backend]
module-name = "asyncutils"
module-root = ""
